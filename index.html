<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Voice Draft - 究極の安定版</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --accent: #ff3b30;
      --text: #f5f5f7;
      --text-dim: #8e8e93;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: env(safe-area-inset-top, 1rem) 1rem 0.5rem;
      text-align: center;
      flex-shrink: 0;
    }

    #current-clock {
      font-size: 1.8rem;
      font-weight: 700;
    }

    #current-date {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0.5rem 1rem;
      gap: 0.5rem;
      min-height: 0;
    }

    #status-bar {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-align: center;
      height: 20px;
    }

    .recording #status-text {
      color: var(--accent);
      font-weight: bold;
    }

    .editor {
      flex: 1;
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #transcript {
      flex: 1;
      font-size: 1.25rem;
      outline: none;
      word-break: break-word;
      overflow-y: auto;
      white-space: pre-wrap;
      -webkit-overflow-scrolling: touch;
    }

    #transcript:empty::before {
      content: "タップして話す...";
      color: var(--text-dim);
      opacity: 0.4;
    }

    .controls {
      padding: 0.5rem 0 env(safe-area-inset-bottom, 1rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    #record-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      color: white;
      font-size: 1.8rem;
      box-shadow: 0 0 0 1px var(--border);
      transition: 0.2s;
    }

    #record-btn.recording {
      background: var(--accent);
      transform: scale(1.1);
    }

    .btn-bar {
      display: flex;
      width: 100%;
      gap: 10px;
    }

    .btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: white;
      padding: 12px 0;
      border-radius: 12px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn:active {
      background: var(--border);
    }

    #char-count {
      position: absolute;
      bottom: 12px;
      right: 15px;
      font-size: 0.75rem;
      color: var(--text-dim);
      background: var(--surface);
      padding: 2px 8px;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <header>
    <div id="current-clock">00:00</div>
    <div id="current-date">----/--/--</div>
  </header>

  <div class="main">
    <div id="status-bar"><span id="status-text">Ready</span></div>

    <div class="editor">
      <div id="transcript" contenteditable="true" spellcheck="false" inputmode="text"></div>
      <div id="char-count">0 文字</div>
    </div>

    <div class="controls">
      <button id="record-btn">🎙️</button>
      <div class="btn-bar">
        <button class="btn" id="save-btn"><span>💾</span><span>保存</span></button>
        <button class="btn" id="copy-btn"><span>📋</span><span>コピー</span></button>
        <button class="btn" id="clear-btn" style="color: var(--accent)"><span>🗑️</span><span>消去</span></button>
      </div>
    </div>
  </div>

  <div id="toast"
    style="position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: white; color: black; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 9999;">
  </div>

  <script>
    const transcriptDiv = document.getElementById('transcript');
    const recordBtn = document.getElementById('record-btn');
    const statusText = document.getElementById('status-text');
    const charCountArea = document.getElementById('char-count');

    let recognition = null;
    let isRecording = false;

    function updateCharCount() {
      const text = transcriptDiv.innerText || "";
      charCountArea.textContent = text.length + ' 文字';
    }

    // 時計更新
    function tick() {
      const now = new Date();
      document.getElementById('current-clock').textContent =
        now.getHours().toString().padStart(2, '0') + ':' +
        now.getMinutes().toString().padStart(2, '0');
      document.getElementById('current-date').textContent =
        now.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
    }
    setInterval(tick, 1000); tick();

    // 復元
    const saved = localStorage.getItem('vd_draft');
    if (saved) {
      transcriptDiv.innerText = saved;
      updateCharCount();
    }

    // 音声認識の初期化
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = false; // 確定済みのみを取得するため false に設定
      recognition.lang = 'ja-JP';

      recognition.onresult = (e) => {
        let final = '';
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) {
            final += e.results[i][0].transcript;
          }
        }
        if (final) {
          // 「改行」という言葉を実際の改行に置換
          const processed = final.replace(/改行/g, '\n');
          // 既存のテキストの末尾に追加（重複を防ぐため isFinal のみ）
          transcriptDiv.innerText += processed;
          
          save();
          updateCharCount();
          // 下部へスクロール
          transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
        }
      };

      recognition.onstart = () => {
        isRecording = true;
        recordBtn.classList.add('recording');
        statusText.textContent = 'Recording...';
        document.body.classList.add('recording');
      };

      recognition.onend = () => {
        if (isRecording) {
          // 録音中であれば自動再開（通信断などへの対策）
          try { recognition.start(); } catch (err) { console.error(err); }
        } else {
          recordBtn.classList.remove('recording');
          statusText.textContent = 'Ready';
          document.body.classList.remove('recording');
        }
      };

      recognition.onerror = (e) => {
        console.error('Speech recognition error:', e.error);
        if (e.error === 'not-allowed') {
          alert('マイクの使用が許可されていません');
          isRecording = false;
        }
      };
    }

    recordBtn.onclick = () => {
      if (isRecording) {
        isRecording = false;
        recognition.stop();
      } else {
        if (recognition) {
          recognition.start();
        } else {
          alert('このブラウザは音声認識に対応していません');
        }
      }
    };

    function save() {
      localStorage.setItem('vd_draft', transcriptDiv.innerText);
    }

    function toast(m) {
      const t = document.getElementById('toast');
      t.textContent = m;
      t.style.opacity = 1;
      setTimeout(() => t.style.opacity = 0, 2000);
    }

    // 保存ボタン (.md ファイル書き出し)
    document.getElementById('save-btn').onclick = () => {
      const text = transcriptDiv.innerText;
      if (!text || text.trim() === "") return toast('保存する内容がありません');

      const now = new Date();
      const Y = now.getFullYear();
      const M = (now.getMonth() + 1).toString().padStart(2, '0');
      const D = now.getDate().toString().padStart(2, '0');
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');

      const filename = `VoiceDraft_${Y}${M}${D}_${h}${m}.md`;
      const blob = new Blob([text], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      toast('保存しました (' + filename + ')');
    };

    // コピーボタン
    document.getElementById('copy-btn').onclick = () => {
      const text = transcriptDiv.innerText;
      if (!text) return toast('コピーする内容がありません');
      navigator.clipboard.writeText(text).then(() => {
        toast('クリップボードにコピーしました');
      });
    };

    // 消去ボタン
    document.getElementById('clear-btn').onclick = () => {
      if (confirm('すべての内容を消去しますか？')) {
        transcriptDiv.innerText = '';
        save();
        updateCharCount();
        toast('消去しました');
      }
    };

    // 手入力時も文字数を更新
    transcriptDiv.oninput = () => {
      save();
      updateCharCount();
    };
  </script>
</body>

</html>
