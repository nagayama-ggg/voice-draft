<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Voice Draft Pro - シンプル保存版</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #121212;
      --card: #1c1c1e;
      --accent: #0a84ff;
      --danger: #ff453a;
      --success: #32d74b;
      --text: #ffffff;
      --text-dim: #8e8e93;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: env(safe-area-inset-top, 1rem) 1rem 0.5rem;
      text-align: center;
      flex-shrink: 0;
      background: linear-gradient(to bottom, var(--surface), var(--bg));
    }

    #current-clock {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    #current-date {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0.5rem 1rem;
      gap: 0.8rem;
      min-height: 0;
    }

    #status-bar {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-align: center;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .recording-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: 0.3s;
    }

    .recording .recording-indicator {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }

      100% {
        opacity: 1;
      }
    }

    .editor {
      flex: 1;
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      min-height: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    #transcript {
      flex: 1;
      font-size: 1.3rem;
      line-height: 1.6;
      outline: none;
      word-break: break-word;
      overflow-y: auto;
      white-space: pre-wrap;
      -webkit-overflow-scrolling: touch;
    }

    #transcript:empty::before {
      content: "マイクをタップして執筆開始...";
      color: var(--text-dim);
      opacity: 0.5;
    }

    .controls {
      padding: 0.5rem 0 env(safe-area-inset-bottom, 1rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .main-action {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    #record-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      color: white;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1px var(--border), 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    #record-btn.recording {
      background: var(--danger);
      transform: scale(1.15);
      box-shadow: 0 0 20px rgba(255, 69, 58, 0.4);
    }

    #undo-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    #undo-btn:active {
      background: var(--border);
      transform: scale(0.9);
    }

    .btn-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      gap: 12px;
    }

    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: white;
      padding: 14px 0;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
    }

    .btn:active {
      background: var(--card);
      transform: translateY(2px);
    }

    .btn.success-flash {
      background: var(--success) !important;
      color: var(--bg) !important;
    }

    #char-count {
      position: absolute;
      bottom: 12px;
      right: 18px;
      font-size: 0.8rem;
      color: var(--text-dim);
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 10px;
      pointer-events: none;
    }

    #toast {
      position: fixed;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>

<body>
  <header>
    <div id="current-clock">00:00</div>
    <div id="current-date">----/--/--</div>
    <div id="current-filename" style="font-size: 0.7rem; color: var(--text-dim); margin-top: 4px;">Filename: Loading...
    </div>
  </header>

  <div class="main">
    <div id="status-bar">
      <div class="recording-indicator"></div>
      <span id="status-text">Ready</span>
    </div>

    <div class="editor">
      <div id="transcript" contenteditable="true" spellcheck="false" inputmode="text"></div>
      <div id="char-count">0 文字</div>
    </div>

    <div class="controls">
      <div class="main-action">
        <button id="undo-btn" title="一歩戻る">↩️</button>
        <button id="record-btn">🎙️</button>
        <button id="paste-btn" class="btn"
          style="width: 50px; height: 50px; border-radius: 50%; padding: 0;"><span>📋</span><span
            style="font-size: 0.6rem;">Paste</span></button>
      </div>

      <div class="btn-bar">
        <button class="btn" id="copy-next-btn"
          style="background: var(--accent); border-color: var(--accent);"><span>⏭️</span><span>Copy &
            Next</span></button>
        <button class="btn" id="save-btn"><span>💾</span><span>保存</span></button>
        <button class="btn" id="copy-btn"><span>📋</span><span>コピー</span></button>
        <button class="btn" id="clear-btn" style="color: var(--danger)"><span>🗑️</span><span>全消去</span></button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- App Version Footer -->
  <div style="text-align: center; padding: 10px; font-size: 0.6rem; color: var(--text-dim); opacity: 0.5;">
    App Version: Fix-06
  </div>

  <script>
    const transcriptDiv = document.getElementById('transcript');
    const recordBtn = document.getElementById('record-btn');
    const undoBtn = document.getElementById('undo-btn');
    const pasteBtn = document.getElementById('paste-btn');
    const statusText = document.getElementById('status-text');
    const charCountArea = document.getElementById('char-count');
    const filenameDisplay = document.getElementById('current-filename');

    let recognition = null;
    let isRecording = false;
    let silenceTimer = null;
    let history = [];
    let versionCount = 1;

    // ヘルパー: 日時文字列取得 (YYYYMMDD_HHMM)
    function getDateTimeString() {
      const now = new Date();
      const Y = now.getFullYear();
      const M = String(now.getMonth() + 1).padStart(2, '0');
      const D = String(now.getDate()).padStart(2, '0');
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      return `${Y}${M}${D}_${h}${m}`;
    }

    function generateFilename() {
      const dt = getDateTimeString();
      return `VoiceDraft_${dt}_v${versionCount}.md`;
    }

    function updateFilenameDisplay() {
      const currentFullFilename = generateFilename();
      filenameDisplay.textContent = `Filename: ${currentFullFilename}`;
      return currentFullFilename;
    }

    function saveHistory() {
      localStorage.setItem('vd_history', JSON.stringify(history));
    }

    function updateCharCount() {
      const text = transcriptDiv.innerText || "";
      charCountArea.textContent = text.length.toLocaleString() + ' 文字';
    }

    function tick() {
      const now = new Date();
      document.getElementById('current-clock').textContent =
        now.getHours().toString().padStart(2, '0') + ':' +
        now.getMinutes().toString().padStart(2, '0');
      document.getElementById('current-date').textContent =
        now.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
    }

    // 従来のダウンロード方式（フォールバック用：遅延付きで空ファイル防止）
    function triggerDownload(content, filename) {
      // BOMを付加し、バイナリストリームとして扱う（.txtの自動付与を回避）
      const blob = new Blob(["\uFEFF" + content], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();

      // Android等での空ファイル対策: 十分な遅延を入れてから revoke する
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 5000);
    }

    // ★保存処理 (毎回必ず新規ダイアログを開く)
    async function performSave(content, suggestedFilename) {
      if (!content) return false;

      // 保存前の確定フィードバック
      toast(`保存準備中: ${content.length}文字`);
      console.log(`Saving ${content.length} characters...`);

      let success = false;
      // File System Access API に対応しているかチェック
      if ('showSaveFilePicker' in window) {
        try {
          // 毎回新規でピッカーを開く
          const fileHandle = await window.showSaveFilePicker({
            suggestedName: suggestedFilename,
            types: [{
              description: 'Markdown File',
              accept: { 'application/octet-stream': ['.md'] },
            }],
          });

          const writable = await fileHandle.createWritable();
          // 書き込み時にもBOMを付加
          await writable.write("\uFEFF" + content);
          await writable.close();
          success = true;
        } catch (err) {
          if (err.name === 'AbortError') {
            success = false;
          } else {
            console.error('Save Error:', err);
            triggerDownload(content, suggestedFilename);
            success = true;
          }
        }
      } else {
        triggerDownload(content, suggestedFilename);
        success = true;
      }

      // ★保存後のフォローアップ通知 (自動再開はせず、ユーザーに促す)
      if (success) {
        toast("保存しました。マイクを押して再開");
      }

      return success;
    }

    function toast(m) {
      const t = document.getElementById('toast');
      t.textContent = m;
      t.style.opacity = 1;
      setTimeout(() => t.style.opacity = 0, 1500);
    }

    function flashButton(btn) {
      btn.classList.add('success-flash');
      setTimeout(() => btn.classList.remove('success-flash'), 500);
    }

    // 音声認識の設定
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'ja-JP';

      recognition.onresult = (e) => {
        let final = '';
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) final += e.results[i][0].transcript;
        }
        if (final) {
          const processed = final.replace(/改行/g, '\n');
          transcriptDiv.innerText += processed;
          history.push(processed);
          saveHistory();
          updateCharCount();
          transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
        }
      };

      recognition.onstart = () => {
        isRecording = true;
        recordBtn.classList.add('recording');
        statusText.textContent = 'Recording...';
      };

      recognition.onend = () => {
        // ユーザーが手動で停止（isRecording = false）していない場合は、自動再開を試みる
        if (isRecording) {
          try {
            recognition.start();
            console.log("SpeechRecognition automatically restarted.");
          } catch (err) {
            console.error("Recognition restart error:", err);
          }
        } else {
          recordBtn.classList.remove('recording');
          statusText.textContent = 'Ready';
        }
      };

      recognition.onerror = (e) => {
        console.error('Speech recognition error:', e.error);
        if (e.error === 'not-allowed') toast('マイクの使用を許可してください');
      };
    }

    recordBtn.onclick = () => {
      if (isRecording) {
        isRecording = false;
        recognition.stop();
      } else if (recognition) {
        recognition.start();
      } else {
        toast('音声認識非対応ブラウザです');
      }
    };

    undoBtn.onclick = () => {
      if (history.length > 0) {
        const lastInput = history.pop();
        if (transcriptDiv.innerText.endsWith(lastInput)) {
          transcriptDiv.innerText = transcriptDiv.innerText.slice(0, -lastInput.length);
          saveHistory();
          updateCharCount();
          toast('戻しました');
        } else {
          undoBtn.onclick();
        }
      } else {
        toast('履歴がありません');
      }
    };

    pasteBtn.onclick = async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          const processedText = `\n${text}\n`;
          transcriptDiv.innerText += processedText;
          history.push(processedText);
          saveHistory();
          updateCharCount();
          transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
          toast('追記ペースト完了');
        }
      } catch (err) { toast('失敗'); }
    };

    // Copy & Next (保存ダイアログ + バージョンアップ)
    document.getElementById('copy-next-btn').onclick = async () => {
      // 1. 保存開始時にマイクを強制終了して競合を防ぐ
      if (isRecording) {
        isRecording = false;
        recognition.stop();
        recordBtn.classList.remove('recording');
        statusText.textContent = 'Ready';
      }

      // 2. 内容の確実な取得（空文字防止）
      let text = transcriptDiv.innerText;
      if (!text || text.trim() === "") {
        text = " "; // 0バイトファイルを防ぐため半角スペースを入れる
        toast('内容が空のためスペースを保存します');
      }

      const suggestedFilename = updateFilenameDisplay();
      const success = await performSave(text, suggestedFilename);

      if (success) {
        flashButton(document.getElementById('copy-next-btn'));
        versionCount++;
        updateFilenameDisplay();
        toast('保存完了');
      }
    };

    // 保存 (現在のファイル名で保存ダイアログを表示)
    document.getElementById('save-btn').onclick = async () => {
      // 1. 保存開始時にマイクを強制終了
      if (isRecording) {
        isRecording = false;
        recognition.stop();
        recordBtn.classList.remove('recording');
        statusText.textContent = 'Ready';
      }

      // 2. 内容の確実な取得（空文字防止）
      let text = transcriptDiv.innerText;
      if (!text || text.trim() === "") {
        text = " ";
        toast('内容が空のためスペースを保存します');
      }

      const suggestedFilename = updateFilenameDisplay();
      const success = await performSave(text, suggestedFilename);

      if (success) {
        flashButton(document.getElementById('save-btn'));
        versionCount++;
        updateFilenameDisplay();
        toast('保存完了');
      }
    };

    document.getElementById('copy-btn').onclick = () => {
      const text = transcriptDiv.innerText;
      if (!text) return toast('内容がありません');
      navigator.clipboard.writeText(text).then(() => toast('コピー完了'));
    };

    document.getElementById('clear-btn').onclick = () => {
      transcriptDiv.innerText = '';
      history = [];
      saveHistory();
      updateCharCount();
      toast('クリアしました');
    };

    transcriptDiv.oninput = () => {
      updateCharCount();
    };

    // 初期起動
    setInterval(tick, 1000); tick();
    updateFilenameDisplay();
    transcriptDiv.innerText = '';
    updateCharCount();
  </script>
</body>

</html>
